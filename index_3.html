/* ---------- 主頁籤：家族成員 ---------- */

function FamilyTab() {
  const [familyId, setFamilyId] = useState(null);
  const [breakfast, setBreakfast] = useState(emptyBreakfast());
  const [sizes, setSizes] = useState({});
  const [loading, setLoading] = useState(false);
  const [saving, setSaving] = useState(false);
  const [savedAt, setSavedAt] = useState(null);
  const [loadError, setLoadError] = useState(false);

  const family = FAMILIES.find((f) => f.id === familyId);

  useEffect(() => {
    if (!familyId) return;
    setLoading(true);
    setLoadError(false);
    (async () => {
      try {
        const parsed = await window.dbStorage.get(`submission_v1_${familyId}`);
        if (parsed) {
          setBreakfast(parsed.breakfast || emptyBreakfast());
          setSizes(parsed.sizes || {});
          setSavedAt(parsed.savedAt || null);
        } else {
          setBreakfast(emptyBreakfast());
          const fam = FAMILIES.find((f) => f.id === familyId);
          const initSizes = {};
          fam.members.forEach((m) => (initSizes[m.name] = m.size));
          setSizes(initSizes);
          setSavedAt(null);
        }
      } catch (e) {
        setLoadError(true);
        setBreakfast(emptyBreakfast());
        const fam = FAMILIES.find((f) => f.id === familyId);
        const initSizes = {};
        fam.members.forEach((m) => (initSizes[m.name] = m.size));
        setSizes(initSizes);
      } finally {
        setLoading(false);
      }
    })();
  }, [familyId]);

  const updateMain = (itemId, condId, val) => {
    setBreakfast((b) => ({
      ...b,
      mains: { ...b.mains, [itemId]: { ...b.mains[itemId], [condId]: val } },
    }));
  };
  const updateDrink = (drinkId, val) => {
    setBreakfast((b) => ({ ...b, drinks: { ...b.drinks, [drinkId]: val } }));
  };
  const updateSize = (name, val) => {
    setSizes((s) => ({ ...s, [name]: val }));
  };

  const handleSubmit = async () => {
    setSaving(true);
    try {
      const payload = { breakfast, sizes, savedAt: new Date().toISOString() };
      const result = await window.dbStorage.set(`submission_v1_${familyId}`, payload);
      if (result) {
        setSavedAt(payload.savedAt);
      }
    } catch (e) {
      // keep UI responsive even if the save fails
    } finally {
      setSaving(false);
    }
  };

  if (!family) {
    return (
      <div className="tab-panel">
        <SectionEyebrow>選擇您的家族</SectionEyebrow>
        <div className="family-pick-grid">
          {FAMILIES.map((f) => (
            <button
              key={f.id}
              className="family-pick-card"
              onClick={() => setFamilyId(f.id)}
            >
              <DiamondTag small>{f.name}</DiamondTag>
              <span className="pick-sub">{f.members.length} 位成員</span>
            </button>
          ))}
        </div>
      </div>
    );
  }

  const feeTotal = family.members.reduce((s, m) => s + ROLE_META[m.role].fee, 0);

  return (
    <div className="tab-panel">
      <div className="family-header">
        <button className="back-link" onClick={() => setFamilyId(null)}>
          ← 換一個家族
        </button>
        <DiamondTag>{family.name}</DiamondTag>
      </div>

      {loading ? (
        <div className="loading-note">載入中…</div>
      ) : (
        <>
          {loadError && (
            <div className="warn-note">先前資料讀取失敗，將以空白表單開始，仍可正常填寫送出。</div>
          )}

          <SectionEyebrow>成員與尺寸確認</SectionEyebrow>
          <div className="card">
            {family.members.map((m) => (
              <div className="member-row" key={m.name}>
                <div className="member-id">
                  <span className="member-name">{m.name}</span>
                  <span className="member-birth">{m.birth}</span>
                  <RoleBadge role={m.role} />
                  {ROOM_MAP[m.name] && <span className="room-tag">{ROOM_MAP[m.name]}</span>}
                </div>
                <input
                  className="size-input"
                  value={sizes[m.name] ?? m.size}
                  onChange={(e) => updateSize(m.name, e.target.value)}
                  aria-label={`${m.name} 衣服尺寸`}
                />
              </div>
            ))}
          </div>

          <SectionEyebrow>早餐總份數（全家統一填寫）</SectionEyebrow>
          <div className="card">
            {MAIN_ITEMS.map((item) => (
              <div key={item.id} className="breakfast-item">
                <div className="breakfast-item-name">{item.name}</div>
                {CONDIMENTS.map((c) => (
                  <div className="breakfast-cond-row" key={c.id}>
                    <span className="cond-name">{c.name}</span>
                    <Stepper
                      value={breakfast.mains[item.id][c.id]}
                      onChange={(v) => updateMain(item.id, c.id, v)}
                    />
                  </div>
                ))}
              </div>
            ))}
          </div>

          <SectionEyebrow>飲品總份數</SectionEyebrow>
          <div className="card">
            {DRINKS.map((d) => (
              <div className="breakfast-cond-row" key={d.id}>
                <span className="cond-name">{d.name}</span>
                <Stepper value={breakfast.drinks[d.id]} onChange={(v) => updateDrink(d.id, v)} />
              </div>
            ))}
          </div>

          <SectionEyebrow>應繳費用（僅供核對）</SectionEyebrow>
          <div className="card">
            {family.members.map((m) => (
              <div className="fee-row" key={m.name}>
                <span>{m.name}</span>
                <span>
                  <RoleBadge role={m.role} /> ${ROLE_META[m.role].fee.toLocaleString()}
                </span>
              </div>
            ))}
            <div className="total-line">本家族應繳合計：${feeTotal.toLocaleString()}</div>
          </div>

          <div className="submit-row">
            <button className="cta-btn primary" onClick={handleSubmit} disabled={saving}>
              {saving ? "送出中…" : "送出給揪團的人"}
            </button>
            {savedAt && (
              <div className="saved-note">
                已於 {new Date(savedAt).toLocaleString("zh-TW")} 送出
              </div>
            )}
          </div>
        </>
      )}
    </div>
  );
}

/* ---------- 管理頁（隱藏） ---------- */

function AdminTab() {
  const [code, setCode] = useState("");
  const [unlocked, setUnlocked] = useState(false);
  const [loading, setLoading] = useState(false);
  const [submissions, setSubmissions] = useState({});
  const [paid, setPaid] = useState({});
  const [error, setError] = useState(false);

  const loadAll = useCallback(async () => {
    setLoading(true);
    setError(false);
    try {
      const subs = {};
      const paidMap = {};
      for (const fam of FAMILIES) {
        try {
          const r = await window.dbStorage.get(`submission_v1_${fam.id}`);
          subs[fam.id] = r || null;
        } catch (e) {
          subs[fam.id] = null;
        }
        for (const m of fam.members) {
          if (ROLE_META[m.role].fee === 0) continue;
          try {
            const pr = await window.dbStorage.get(`paid_v1_${fam.id}_${m.name}`);
            paidMap[`${fam.id}_${m.name}`] = !!(pr && pr.paid === true);
          } catch (e) {
            paidMap[`${fam.id}_${m.name}`] = false;
          }
        }
      }
      setSubmissions(subs);
      setPaid(paidMap);
    } catch (e) {
      setError(true);
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => {
    if (unlocked) loadAll();
  }, [unlocked, loadAll]);

  const togglePaid = async (famId, name) => {
    const key = `${famId}_${name}`;
    const next = !paid[key];
    setPaid((p) => ({ ...p, [key]: next }));
    try {
      await window.dbStorage.set(`paid_v1_${famId}_${name}`, { paid: next });
    } catch (e) {
      // revert on failure
      setPaid((p) => ({ ...p, [key]: !next }));
    }
  };

  if (!unlocked) {
    return (
      <div className="tab-panel">
        <SectionEyebrow>管理登入</SectionEyebrow>
        <div className="card admin-login">
          <p className="sub-note">此頁面僅供揪團的人使用，資料為共用儲存，請自行妥善保管密碼。</p>
          <input
            className="admin-input"
            type="password"
            placeholder="請輸入管理密碼"
            value={code}
            onChange={(e) => setCode(e.target.value)}
          />
          <button
            className="cta-btn primary"
            onClick={() => setUnlocked(code === ADMIN_CODE)}
          >
            登入
          </button>
          {code && code !== ADMIN_CODE && (
            <div className="warn-note">密碼錯誤，請再試一次。</div>
          )}
        </div>
      </div>
    );
  }

  // aggregate breakfast totals
  const mainTotals = Object.fromEntries(
    MAIN_ITEMS.map((m) => [m.id, Object.fromEntries(CONDIMENTS.map((c) => [c.id, 0]))])
  );
  const drinkTotals = Object.fromEntries(DRINKS.map((d) => [d.id, 0]));
  Object.values(submissions).forEach((s) => {
    if (!s) return;
    MAIN_ITEMS.forEach((m) =>
      CONDIMENTS.forEach((c) => {
        mainTotals[m.id][c.id] += Number(s.breakfast?.mains?.[m.id]?.[c.id] || 0);
      })
    );
    DRINKS.forEach((d) => (drinkTotals[d.id] += Number(s.breakfast?.drinks?.[d.id] || 0)));
  });

  const paidCount = Object.values(paid).filter(Boolean).length;
  const totalPayers = FAMILIES.reduce(
    (s, f) => s + f.members.filter((m) => ROLE_META[m.role].fee > 0).length,
    0
  );
  const collected = FAMILIES.reduce(
    (s, f) =>
      s +
      f.members.reduce(
        (s2, m) =>
          s2 + (paid[`${f.id}_${m.name}`] ? ROLE_META[m.role].fee : 0),
        0
      ),
    0
  );

  return (
    <div className="tab-panel">
      <div className="family-header">
        <DiamondTag>管理總覽</DiamondTag>
        <button className="back-link" onClick={loadAll} disabled={loading}>
          {loading ? "更新中…" : "重新整理"}
        </button>
      </div>

      {error && <div className="warn-note">部分資料讀取失敗，可點「重新整理」再試一次。</div>}

      <SectionEyebrow>繳費進度</SectionEyebrow>
      <div className="card">
        <div className="total-line">
          已勾選 {paidCount} / {totalPayers} 人・已收 ${collected.toLocaleString()} / ${NET_SPLIT.toLocaleString()}
        </div>
      </div>

      {FAMILIES.map((fam) => (
        <div className="card" key={fam.id}>
          <div className="card-title">{fam.name}</div>
          {submissions[fam.id] ? (
            <div className="sub-note">
              送出時間：{new Date(submissions[fam.id].savedAt).toLocaleString("zh-TW")}
            </div>
          ) : (
            <div className="sub-note">尚未送出資料</div>
          )}
          {fam.members.map((m) => (
            <div className="admin-member-row" key={m.name}>
              <label className="paid-checkbox">
                <input
                  type="checkbox"
                  checked={!!paid[`${fam.id}_${m.name}`]}
                  disabled={ROLE_META[m.role].fee === 0}
                  onChange={() => togglePaid(fam.id, m.name)}
                />
                <span>{m.name}</span>
              </label>
              <span className="admin-member-meta">
                <RoleBadge role={m.role} />
                {ROLE_META[m.role].fee > 0 ? ` $${ROLE_META[m.role].fee.toLocaleString()}` : " 免費"}
                {" ・尺寸："}
                {submissions[fam.id]?.sizes?.[m.name] ?? m.size}
              </span>
            </div>
          ))}
        </div>
      ))}

      <SectionEyebrow>早餐彙總（全家族）</SectionEyebrow>
      <div className="card">
        {MAIN_ITEMS.map((item) => {
          const rowTotal = CONDIMENTS.reduce((s, c) => s + mainTotals[item.id][c.id], 0);
          if (rowTotal === 0) return null;
          return (
            <div key={item.id} className="admin-breakfast-row">
              <div className="breakfast-item-name">{item.name}（共 {rowTotal} 份）</div>
              <div className="cond-summary">
                {CONDIMENTS.filter((c) => mainTotals[item.id][c.id] > 0).map((c) => (
                  <span key={c.id} className="cond-chip">
                    {c.name}×{mainTotals[item.id][c.id]}
                  </span>
                ))}
              </div>
            </div>
          );
        })}
        <div className="admin-breakfast-row">
          <div className="breakfast-item-name">飲品</div>
          <div className="cond-summary">
            {DRINKS.filter((d) => drinkTotals[d.id] > 0).map((d) => (
              <span key={d.id} className="cond-chip">
                {d.name}×{drinkTotals[d.id]}
              </span>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------- App ---------- */

function App() {
  const [tab, setTab] = useState("home");

  return (
    <div className="app-root">
      <style>{CSS}</style>

      <div className="firework-bg" aria-hidden="true" />

      <nav className="tab-bar">
        {[
          ["home", "首頁"],
          ["itinerary", "行程"],
          ["family", "家族成員"],
        ].map(([id, label]) => (
          <button
            key={id}
            className={`tab-btn ${tab === id ? "active" : ""}`}
            onClick={() => setTab(id)}
          >
            {label}
          </button>
        ))}
      </nav>

      <main className="app-main">
        {tab === "home" && (
          <HomeTab goItinerary={() => setTab("itinerary")} goFamily={() => setTab("family")} />

        {tab === "itinerary" && <ItineraryTab />}
        {tab === "family" && <FamilyTab />}
        {tab === "admin" && <AdminTab />}
      </main>

      <footer className="app-footer">
        <span>雄霞家族 2026 父親節旅遊</span>
        <button className="admin-link" onClick={() => setTab("admin")}>
          管理
        </button>
      </footer>
    </div>
  );
}
